<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tofu Nuggets</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <header class="app-head">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <h1>Tofu Nuggets</h1>
    </div>
    <input id="filter" type="search" placeholder="Filter notes…" aria-label="Filter notes" />
  </header>
  <main>
    <ul id="list" class="nugget-list"></ul>
    <p id="empty" class="empty" hidden>
      No notes yet. Hover a desktop icon and press <span id="hotkey-keys"></span> to add one.
    </p>
  </main>
  <footer class="foot">
    <!-- Wording finished by main.js: how the app is removed differs per platform. -->
    <p id="foot-hint"></p>
    <p class="foot-meta">
      <span id="app-version"></span>
      <button type="button" id="report-toggle" class="linkish" aria-expanded="false" aria-controls="report-note">
        Report bugs / request features
      </button>
    </p>
    <!-- In-page: window.alert/confirm/prompt are not implemented by WKWebView. -->
    <p class="report-note" id="report-note" hidden>
      Tofu Nuggets is in active development, so some breakage is expected.
      Bug reports and feature requests are welcome at
      <span class="report-mail">farabigithub@gmail.com</span>.
    </p>
  </footer>
  <script type="module" src="main.js"></script>
</body>
</html>
