[package]
name = "tofu-nuggets"
version = "0.4.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: `transparent(true)` on the overlay needs it on macOS
# (with `macOSPrivateApi` in tauri.conf.json); no-op on Windows, but it must
# live here unconditionally — tauri-build's feature check reads only
# [dependencies], so a target-gated feature fails the macOS build.
tauri = { version = "2", features = ["tray-icon", "image-ico", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
notify = "8.2.0"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2"
# Binary-plist codec for the macOS Finder-tag xattr. Pure Rust, so it also
# builds on Windows where it lets the tag-array transforms be unit-tested; it is
# only *used* at runtime on macOS.
plist = "1"

# Windows-only: Win32/UIA interop + the WebView2 transparency fix. The
# aliased windows-core 0.61 must match tauri's webview2-com — load-bearing,
# see MEMORY.md / ARCHITECTURE.md §2.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core-061 = { package = "windows-core", version = "0.61" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Graphics_Dwm",
] }

# macOS-only: raw Objective-C runtime access to extend the NSApp delegate
# (see lifecycle_mac.rs). Only the `objc2` core is needed — the one selector we
# add is reached through `class!`/`msg_send!`/`ffi`, no AppKit bindings required.
# xattr + libc: read/write the Finder-tag xattr (tags.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
xattr = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
